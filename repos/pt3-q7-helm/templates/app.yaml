apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Release.Name }}}
spec:
  replicas: {{ .Values.replicaCount }}
  selector: {matchLabels: {app: {{ .Release.Name }}}}
  template:
    metadata: {labels: {app: {{ .Release.Name }}}}
    spec:
      volumes: [{name: shared, emptyDir: {}}]
      containers:
      - name: writer
        image: {{ .Values.image }}
        command: [sh,-c,'while true; do echo {{ .Values.message }} > /shared/message; sleep 10; done']
        volumeMounts: [{name: shared, mountPath: /shared}]
      - name: reader
        image: {{ .Values.image }}
        command: [sh,-c,'while true; do cat /shared/message 2>/dev/null || true; sleep 10; done']
        volumeMounts: [{name: shared, mountPath: /shared}]
